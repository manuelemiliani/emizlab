<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emizlab | Próximamente</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            /* Fondo con imagen de laboratorio y capa oscura superpuesta */
            background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.85)), 
                        url('https://images.unsplash.com/photo-1579154204601-01588f351e67?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Tarjeta principal estilo glassmorphism */
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 40px 32px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* Icono 'E' de la marca */
        .logo-icon {
            width: 50px;
            height: 50px;
            background-color: #5b21b6;
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: 700;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px auto;
            box-shadow: 0 4px 12px rgba(91, 33, 182, 0.3);
        }

        .badge {
            display: inline-block;
            background-color: #e0e7ff;
            color: #4338ca;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #1e293b;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        p.subtitle {
            font-size: 0.88rem;
            color: #475569;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .info-box {
            background: rgba(241, 245, 249, 0.8);
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 14px;
            font-size: 0.82rem;
            color: #334155;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .btn-whatsapp {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background-color: #5b21b6;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 12px;
            border-radius: 10px;
            transition: background-color 0.2s ease;
        }

        .btn-whatsapp:hover {
            background-color: #4c1d95;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo-icon">E</div>
        <span class="badge">Próximamente</span>
        <h1>EMIZLAB</h1>
        <p class="subtitle">Portal de Consulta Digital de Resultados de Laboratorio Clínico.</p>

        <div class="info-box">
            Estamos preparando la plataforma para las instituciones de salud de la Región Caribe.
        </div>

        <a href="https://wa.me/573000000000" target="_blank" class="btn-whatsapp">
            💬 Soporte Técnico
        </a>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMIZLAB - Portal de Resultados</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --primary-dark: #5849be;
            --accent: #a29bfe;
            --bg-overlay: rgba(15, 23, 42, 0.65);
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --danger: #e53e3e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Fondo de laboratorio con filtro oscuro encima */
            background: linear-gradient(var(--bg-overlay), var(--bg-overlay)), 
                        url('https://images.unsplash.com/photo-1579154204601-01588f351e67?q=80&w=1600&auto=format&fit=crop') center/cover no-repeat fixed;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .dashboard-container {
            max-width: 650px;
        }

        /* Tarjeta Blanca Principal */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
            padding: 32px 28px;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 54px;
            height: 54px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border-radius: 14px;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 12px;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3);
        }

        .brand-title {
            font-size: 22px;
            color: var(--text-main);
            font-weight: 700;
        }

        .brand-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            color: var(--text-main);
            background-color: #f8fafc;
            transition: all 0.2s ease;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--primary);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.15);
        }

        select.form-control {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23718096' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
        }

        .btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.25);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .btn-outline-danger {
            background: transparent;
            color: var(--danger);
            border: 1.5px solid var(--danger);
            box-shadow: none;
            width: auto;
            padding: 8px 16px;
            font-size: 13px;
        }

        .btn-outline-danger:hover {
            background-color: #fff5f5;
            transform: none;
        }

        .alert-error {
            background-color: #fff5f5;
            color: var(--danger);
            border: 1px solid #fed7d7;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }

        /* Estilos de la Vista de Resultados */
        .user-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1.5px solid #edf2f7;
            padding-bottom: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .user-info h3 {
            font-size: 18px;
            color: var(--text-main);
        }

        .user-info p {
            font-size: 13px;
            color: var(--text-muted);
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 14px;
        }

        .lab-item {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .lab-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .pdf-icon {
            width: 40px;
            height: 40px;
            background-color: #fff5f5;
            color: var(--danger);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 1px solid #fed7d7;
        }

        .lab-details h4 {
            font-size: 14px;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        .lab-details span {
            font-size: 12px;
            color: var(--text-muted);
        }

        .btn-download {
            background-color: var(--primary);
            color: white;
            padding: 8px 14px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .btn-download:hover {
            background-color: var(--primary-dark);
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 480px) {
            .card { padding: 24px 18px; }
            .lab-item { flex-direction: column; align-items: flex-start; }
            .btn-download { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <!-- VISTA DE LOGIN -->
    <div id="loginView" class="container">
        <div class="card">
            <div class="brand-header">
                <div class="brand-logo">E</div>
                <h1 class="brand-title">EMIZLAB</h1>
                <p class="brand-subtitle">Portal de Resultados de Laboratorio</p>
            </div>

            <div id="errorMessage" class="alert-error">
                Usuario o contraseña incorrectos.
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <!-- Tipo de Documento -->
                    <select id="docType" class="form-control" required>
                        <option value="CC">Cédula de Ciudadanía</option>
                        <option value="TI">Tarjeta de Identidad</option>
                        <option value="RC">Registro Civil</option>
                        <option value="PPT">PPT (Permiso por Protección Temporal)</option>
                    </select>
                </div>

                <div class="form-group">
                    <input type="text" id="username" class="form-control" placeholder="Número de Documento" required autocomplete="off">
                </div>

                <div class="form-group">
                    <input type="password" id="password" class="form-control" placeholder="Contraseña" required>
                </div>

                <button type="submit" class="btn">
                    <span>Iniciar Sesión</span>
                </button>
            </form>
        </div>
    </div>

    <!-- VISTA DE DASHBOARD / RESULTADOS -->
    <div id="dashboardView" class="container dashboard-container hidden">
        <div class="card">
            <div class="user-header">
                <div class="user-info">
                    <h3>Andrés Gómez</h3>
                    <p>CC: 12345</p>
                </div>
                <button onclick="handleLogout()" class="btn btn-outline-danger">
                    Salir
                </button>
            </div>

            <h2 class="section-title">Resultados de Laboratorio</h2>

            <div class="lab-item">
                <div class="lab-info">
                    <div class="pdf-icon">
                        <!-- Icono SVG de PDF -->
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    </div>
                    <div class="lab-details">
                        <h4>Parcial de Orina y Urocultivo</h4>
                        <span>Fecha: 21/08/2026 • Estado: Completado</span>
                    </div>
                </div>
                <a href="#" onclick="downloadMockPDF(event)" class="btn-download">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    Descargar
                </a>
            </div>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('errorMessage');

            // Validación de credenciales de prueba
            if (user === "12345" && pass === "12345") {
                errorDiv.style.display = "none";
                document.getElementById('loginView').classList.add('hidden');
                document.getElementById('dashboardView').classList.remove('hidden');
            } else {
                errorDiv.style.display = "block";
            }
        }

        function handleLogout() {
            document.getElementById('loginForm').reset();
            document.getElementById('dashboardView').classList.add('hidden');
            document.getElementById('loginView').classList.remove('hidden');
        }

        function downloadMockPDF(event) {
            event.preventDefault();
            alert("Iniciando descarga del examen: Parcial de Orina y Urocultivo...");
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Emizlab - Portal de Resultados de Laboratorio Clínico</title>
    
    <!-- FAVICON -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300a896' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55A1 1 0 0 0 5.611 22h12.778a1 1 0 0 0 .891-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2'/%3E%3Cline x1='8.5' y1='2' x2='15.5' y2='2'/%3E%3Cline x1='7' y1='16' x2='17' y2='16'/%3E%3C/svg%3E">

    <meta name="description" content="Consulta y descarga tus resultados de laboratorio clínico en línea de manera rápida, segura y confidencial con Emizlab.">
    <meta name="keywords" content="Emizlab, resultados de laboratorio, laboratorio clinico, examenes medicos, consulta de resultados, salud">
    <meta name="robots" content="index, follow">
    <meta name="author" content="Emizlab">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="estilo.css" rel="stylesheet" type="text/css" />

</head>
<body>

    <!-- VISTA LOGIN -->
    <div id="loginView" class="container">
        <div class="card">
            <div class="brand-header">
                <div class="brand-logo-container">
                    <div class="brand-icon">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55A1 1 0 0 0 5.611 22h12.778a1 1 0 0 0 .891-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/>
                            <line x1="8.5" y1="2" x2="15.5" y2="2"/>
                            <line x1="7" y1="16" x2="17" y2="16"/>
                        </svg>
                    </div>
                    <h1 class="brand-title">Emizlab</h1>
                </div>
                <p class="brand-subtitle">Portal de Resultados de Laboratorio</p>
            </div>

            <div id="errorMessage" class="alert-error">
                Usuario, contraseña o tipo de documento incorrectos.
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <select id="docType" class="form-control" onchange="toggleForgotLink()" required>
                        <option value="CC">Cédula de Ciudadanía</option>
                        <option value="TI">Tarjeta de Identidad</option>
                        <option value="RC">Registro Civil</option>
                        <option value="NV">Certificado de Nacido Vivo</option>
                        <option value="PPT">PPT (Permiso por Protección Temporal)</option>
                        <option value="EMP">Empleados</option>
                    </select>
                </div>

                <div class="form-group">
                    <input type="text" id="username" class="form-control" placeholder="Número de Documento / Usuario" required autocomplete="off">
                </div>

                <div class="form-group">
                    <input type="password" id="password" class="form-control" placeholder="Contraseña" required>
                </div>

                <button type="submit" class="btn">
                    <span>Iniciar Sesión</span>
                </button>

                <div id="forgotPasswordContainer" class="forgot-password-container hidden">
                    <a href="#" onclick="handleForgotPassword(event)" class="forgot-password-link">¿Olvidaste tu contraseña?</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        function toggleForgotLink() {
            const docType = document.getElementById('docType').value;
            const forgotContainer = document.getElementById('forgotPasswordContainer');
            if (docType === "EMP") {
                forgotContainer.classList.remove('hidden');
            } else {
                forgotContainer.classList.add('hidden');
            }
        }

        function handleForgotPassword(event) {
            event.preventDefault();
            alert("Para restablecer tu contraseña corporativa de Emizlab, por favor contacta al Administrador de Sistemas o a la jefatura de laboratorio.");
        }

        function handleLogin(event) {
            event.preventDefault();
            
            const docType = document.getElementById('docType').value;
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('errorMessage');

            if (docType === "EMP") {
                // Validación para el rol de empleados (999 que va a panel2.html)
                if (user === "999" && pass === "999") {
                    errorDiv.style.display = "none";
                    window.location.href = "panel2.html";
                    return;
                }
                
                errorDiv.style.display = "block";
                return;
            }

            errorDiv.style.display = "block";
        }
    </script>
</body>
</html>
